<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Ivory Dental Studio Hyderabad</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F6F2">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg);
      padding: 32px 20px;
      text-align: center;
    }
    .error-card {
      background-color: var(--surface);
      border: 1px solid var(--silver);
      border-radius: 28px;
      padding: clamp(36px, 6vw, 64px) clamp(24px, 5vw, 48px);
      max-width: 540px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
    }
    .error-code {
      display: inline-block;
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 700;
      color: var(--bronze);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    .error-title {
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .error-desc {
      font-size: 15.5px;
      color: rgba(38, 39, 35, 0.8);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .error-actions {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <div class="error-card">
      <span class="error-code">404</span>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The clinic page you are looking for has moved or does not exist. Return home or contact our clinical team directly.
      </p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">
          Back to Home
          <span class="btn-arrow-icon" aria-hidden="true">&rarr;</span>
        </a>
        <a href="tel:+910000000000" class="btn btn-secondary">
          Call Clinic
        </a>
        <a href="https://wa.me/910000000000" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          WhatsApp
        </a>
      </div>
    </div>
  </div>
</body>
</html>
